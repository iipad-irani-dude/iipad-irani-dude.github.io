<!DOCTYPE html>
<html>
<head>
    <title></title>

    <style>
        body {
            margin: 0;
            background: #0b1020;
            font-family: Arial, sans-serif;
        }

        .top {
            height: 140px;
            background: #111827;
            margin: 20px;
            border-radius: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px;
        }

        .box {
            height: 220px;
            background: #111827;
            border: 1px solid #293548;
            border-radius: 20px;
        }

        .wide {
            grid-column: span 2;
            height: 150px;
        }

        .bottom {
            height: 80px;
            background: #111827;
            margin: 20px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="top"></div>

    <div class="container">

        <div class="box"></div>
        <div class="box"></div>

        <div class="box wide"></div>

        <div class="box"></div>
        <div class="box"></div>

    </div>

    <div class="bottom"></div>

</body>
</html>
